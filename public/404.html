<!doctype html>
<script>
  // GitHub Pages SPA redirect: encode the path into the query string
  // so the server serves index.html and the client can restore the URL.
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 2).join('/') +
    '/?p=' + encodeURIComponent(l.pathname.slice(1) + l.search) +
    (l.hash ? l.hash : '')
  );
</script>
